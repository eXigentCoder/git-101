<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 101 – Glossary</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a class="brand" href="index.html">AI 101</a>
      <a href="index.html">Primer</a>
      <a href="glossary.html">Glossary</a>
    </nav>
    <div class="hero">
      <h1>Glossary</h1>
      <p class="tagline">Plain-English definitions of the AI terms you'll hear most.</p>
    </div>
  </header>

  <main class="content">
    <section class="card">
      <label class="search-label" for="glossary-search">Filter terms</label>
      <input id="glossary-search" class="search" type="search" placeholder="e.g. token" data-glossary-search>
      <dl class="glossary" data-glossary>
        <dt class="loading">Loading glossary…</dt>
      </dl>
    </section>
  </main>

  <footer class="site-footer">
    <p>Terms live in <code>site/data/glossary.json</code>. Add one and refresh!</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
